<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
  <title id="title">X-RUSH mobile pixel console</title>
  <desc id="desc">A rearranged, large-type mobile version of the X-RUSH pixel developer console with a runner breaking its frame.</desc>
  <defs>
