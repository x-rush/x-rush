  <path d="M32 520H594L608 534V598L594 612H32Z" fill="#0D1321" stroke="#30445C"/>
  <text x="52" y="557" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#FF6B35">INDEX_OUT_OF_BOUNDS</text>
  <text x="354" y="557" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#B8F35A">// INTENTIONAL</text>
  <text x="52" y="592" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#D7E1EA">BREAK THE FRAME. KEEP THE SIGNAL.</text>
  <text x="32" y="654" font-family="ui-monospace, Consolas, monospace" font-size="20" letter-spacing="1" fill="#71869E">BUILDING IN PUBLIC SINCE 2021</text>
