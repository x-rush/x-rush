    <g id="wordmark">
      <use href="#glyph-x" transform="translate(32 132) scale(12)"/>
      <use href="#glyph-dash" transform="translate(104 132) scale(12)"/>
      <use href="#glyph-r" transform="translate(152 132) scale(12)"/>
      <use href="#glyph-u" transform="translate(224 132) scale(12)"/>
      <use href="#glyph-s" transform="translate(296 132) scale(12)"/>
