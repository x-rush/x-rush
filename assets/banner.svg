<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="x-rush — giving AI agents eyes, ears and hands">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#0a0e14"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <rect y="330" width="1200" height="90" fill="url(#fadeUp)"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="17" fill="none" stroke="#FF6B35" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="46" cy="40" r="8" fill="#ff5f56"/>
  <circle cx="74" cy="40" r="8" fill="#ffbd2e"/>
  <circle cx="102" cy="40" r="8" fill="#27c93f"/>
  <text x="600" y="46" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="17" fill="#8b949e">rush@github: ~ — agent session</text>
  <rect x="36" y="66" width="1128" height="2" fill="url(#ruleGrad)"/>

  <text x="72" y="134" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="22" fill="#FF6B35">$ whoami</text>

  <text x="72" y="216" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="url(#titleGrad)">x-rush</text>
  <rect x="292" y="166" width="26" height="60" fill="#FF6B35">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="270" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="26" fill="#c9d1d9">one developer, shipping like a team</text>
  <text x="72" y="308" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace" font-size="21" fill="#FFD23F" opacity="0.85">一个人，一支战队的产出：引擎 · 工作流 · 应用 · 内容</text>

  <text x="72" y="372" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="18" fill="#6e7681">&gt; forges: image-forge · music-forge · video-forge</text>

  <g>
    <circle cx="920" cy="392" r="2.6" fill="#FF6B35" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.7;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -10 -150" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="985" cy="398" r="2.1" fill="#FFD23F" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.15;0.7;1" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 -120" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1042" cy="394" r="3" fill="#FF6B35" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.15;0.7;1" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 6 -170" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1096" cy="398" r="2.3" fill="#FFD23F" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.15;0.7;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -8 -135" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1145" cy="392" r="1.8" fill="#FF8A3D" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.7;1" dur="2.5s" begin="2.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -14 -110" dur="2.5s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
