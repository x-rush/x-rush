  <use href="#wordmark" fill="url(#titleInk)" shape-rendering="crispEdges"/>

  <text x="64" y="260" class="mono" font-size="23" font-weight="700" letter-spacing="1" fill="#D7E1EA">ONE DEVELOPER. FULL PARTY.</text>
  <text x="64" y="305" class="mono" font-size="17" fill="#91A3B8">&gt; make agents actually ship</text>
  <rect x="350" y="289" width="10" height="18" class="cursor" fill="#5DEFFF" shape-rendering="crispEdges"/>

