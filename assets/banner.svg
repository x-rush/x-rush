  <text x="1180" y="34" class="mono" font-size="12" letter-spacing="1" fill="#B8F35A">ONLINE</text>

  <text x="64" y="96" class="mono" font-size="13" letter-spacing="1.4" fill="#5DEFFF">[ DEV_PROFILE // 0x2021 ]</text>
  <text x="528" y="96" class="mono" font-size="11" fill="#63758C">v4.0</text>

