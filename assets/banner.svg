    <rect x="434" y="351" width="7" height="7" fill="#FF6B35" shape-rendering="crispEdges"/>
    <text x="451" y="360" fill="#AFC1D2">CONTENT</text>
  </g>
  <text x="64" y="400" class="mono" font-size="11" letter-spacing="1.2" fill="#63758C">BUILDING IN PUBLIC SINCE 2021</text>

