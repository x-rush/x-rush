<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">X-RUSH — One developer. Full party.</title>
  <desc id="desc">A refined pixel-art developer console. A cyan and violet runner breaks through an exception monitor, symbolizing an intentional index-out-of-bounds exception.</desc>
  <defs>
    <linearGradient id="titleInk" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="526" y2="0">
      <stop offset="0" stop-color="#5DEFFF"/>
      <stop offset="0.58" stop-color="#5DEFFF"/>
      <stop offset="1" stop-color="#9D7CFF"/>
    </linearGradient>
    <linearGradient id="floorInk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5DEFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9D7CFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5DEFFF" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#D7E1EA" opacity="0.018"/>
    </pattern>
    <clipPath id="monitorClip">
      <path d="M746 80H1114L1130 96V354L1114 370H746L730 354V96Z"/>
    </clipPath>
    <path id="glyph-x" d="M0 0h1v1H0zM4 0h1v1H4zM0 1h1v1H0zM4 1h1v1H4zM1 2h1v1H1zM3 2h1v1H3zM2 3h1v1H2zM1 4h1v1H1zM3 4h1v1H3zM0 5h1v1H0zM4 5h1v1H4zM0 6h1v1H0zM4 6h1v1H4z"/>
    <path id="glyph-r" d="M0 0h4v1H0zM0 1h1v1H0zM4 1h1v1H4zM0 2h1v1H0zM4 2h1v1H4zM0 3h4v1H0zM0 4h1v1H0zM2 4h1v1H2zM0 5h1v1H0zM3 5h1v1H3zM0 6h1v1H0zM4 6h1v1H4z"/>
    <path id="glyph-u" d="M0 0h1v5H0zM4 0h1v5H4zM1 5h3v1H1zM1 6h3v1H1z"/>
    <path id="glyph-s" d="M1 0h4v1H1zM0 1h1v1H0zM0 2h1v1H0zM1 3h3v1H1zM4 4h1v1H4zM4 5h1v1H4zM0 6h4v1H0z"/>
    <path id="glyph-h" d="M0 0h1v7H0zM4 0h1v7H4zM1 3h3v1H1z"/>
    <path id="glyph-dash" d="M0 3h3v1H0z"/>
    <g id="wordmark">
      <use href="#glyph-x" transform="translate(64 120) scale(14)"/>
      <use href="#glyph-dash" transform="translate(148 120) scale(14)"/>
      <use href="#glyph-r" transform="translate(204 120) scale(14)"/>
      <use href="#glyph-u" transform="translate(288 120) scale(14)"/>
      <use href="#glyph-s" transform="translate(372 120) scale(14)"/>
      <use href="#glyph-h" transform="translate(456 120) scale(14)"/>
    </g>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace; }
      .cursor { animation: blink 1.15s steps(1, end) infinite; }
      .core { animation: corePulse 2.8s steps(2, end) infinite; }
      .particle-a { animation: driftA 5.2s steps(8, end) infinite; }
      .particle-b { animation: driftB 6.4s steps(8, end) 1.1s infinite; }
      @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
      @keyframes corePulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
      @keyframes driftA { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(26px, -22px); opacity: 0; } }
      @keyframes driftB { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: .75; } 100% { transform: translate(18px, -30px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .core, .particle-a, .particle-b { animation: none; }
        .particle-a, .particle-b { opacity: .55; }
      }
    </style>
  </defs>

