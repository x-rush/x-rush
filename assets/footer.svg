<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" role="img" aria-labelledby="title desc">
  <title id="title">X-RUSH — Enter the next checkpoint</title>
  <desc id="desc">A large pixel terminal end panel. Building in public since 2021 connects through a glowing pixel portal to the next checkpoint beyond the limit.</desc>
  <defs>
    <linearGradient id="progressInk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5DEFFF"/>
      <stop offset="1" stop-color="#9D7CFF"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5DEFFF" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#D7E1EA" opacity="0.018"/>
    </pattern>
  </defs>

  <path d="M16 0H1264L1280 16V224L1264 240H16L0 224V16Z" fill="#070A12"/>
  <path d="M16 2H1262L1278 18V222L1262 238H18L2 222V18Z" fill="url(#grid)"/>
  <path d="M16 2H1262L1278 18V222L1262 238H18L2 222V18Z" fill="url(#scanlines)"/>
  <path d="M18 2H1262L1278 18V48H2V18Z" fill="#0D1321"/>
  <path d="M16 1H1264L1279 16V224L1264 239H16L1 224V16Z" fill="none" stroke="#2A3A50" stroke-width="2"/>
  <path d="M2 48H1278" stroke="#223248"/>

  <g shape-rendering="crispEdges">
    <rect x="26" y="19" width="10" height="10" fill="#5DEFFF"/>
    <rect x="46" y="19" width="10" height="10" fill="#9D7CFF"/>
    <rect x="66" y="19" width="10" height="10" fill="#B8F35A"/>
    <rect x="1120" y="21" width="110" height="8" fill="#152A35"/>
    <rect x="1120" y="21" width="86" height="8" fill="#B8F35A"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
    <text x="94" y="32" font-size="14" letter-spacing="1.4" fill="#91A3B8">X-RUSH // SESSION_EOF</text>
    <text x="962" y="32" font-size="14" letter-spacing="1" fill="#71869E">CHECKPOINT 08</text>

    <text x="40" y="88" font-size="20" letter-spacing="1" fill="#5DEFFF">BUILDING IN PUBLIC</text>
    <text x="40" y="130" font-size="30" font-weight="700" letter-spacing="1.2" fill="#D7E1EA">SINCE 2021</text>
    <text x="40" y="169" font-size="16" fill="#91A3B8">ONE DEV. FULL PARTY.</text>
    <text x="40" y="195" font-size="16" fill="#91A3B8">ALWAYS SHIPPING.</text>

    <text x="820" y="88" font-size="18" letter-spacing="1" fill="#9D7CFF">NEXT CHECKPOINT:</text>
    <text x="820" y="132" font-size="30" font-weight="700" letter-spacing="1" fill="#D7E1EA">BEYOND THE LIMIT_</text>
    <text x="820" y="173" font-size="18" fill="#B8F35A">&gt; ENTER NEXT LEVEL</text>
    <text x="820" y="199" font-size="14" letter-spacing="1" fill="#71869E">NO LIMITS // BY DESIGN</text>
  </g>

  <g fill="none" stroke="#294154" stroke-width="2">
    <path d="M490 132H566" stroke-dasharray="12 8"/>
    <path d="M714 132H790" stroke-dasharray="12 8"/>
  </g>
  <g shape-rendering="crispEdges">
    <rect x="556" y="127" width="10" height="10" fill="#5DEFFF"/>
    <rect x="714" y="127" width="10" height="10" fill="#9D7CFF"/>
  </g>

  <g transform="translate(586 66) scale(6)" shape-rendering="crispEdges">
    <path d="M4 22V8H5V4H7V2H11V4H13V8H14V22H12V9H11V6H7V9H6V22Z" fill="#9D7CFF" opacity="0.3"/>
    <path d="M5 22V8H6V5H7V4H11V5H12V8H13V22H11V9H10V7H8V9H7V22Z" fill="#5DEFFF"/>
    <path d="M7 22V10H8V8H10V10H11V22Z" fill="#0D1321"/>
    <path d="M7 15H9V13H10V14H12V16H11V17H10V19H9V17H7Z" fill="#B8F35A"/>
    <rect x="2" y="5" width="1" height="1" fill="#5DEFFF"/>
    <rect x="15" y="9" width="1" height="1" fill="#9D7CFF"/>
    <rect x="1" y="15" width="1" height="1" fill="#9D7CFF"/>
    <rect x="16" y="18" width="1" height="1" fill="#FF6B35"/>
    <rect x="4" y="1" width="1" height="1" fill="#D7E1EA"/>
  </g>

  <rect x="40" y="218" width="1200" height="6" fill="#0D1321"/>
  <rect x="40" y="218" width="892" height="6" fill="url(#progressInk)"/>
  <rect x="932" y="218" width="18" height="6" fill="#B8F35A" shape-rendering="crispEdges"/>
</svg>
